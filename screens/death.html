<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERMAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --bg:           #080a04;
    --panel-bg:     #0b0f05;
    --phosphor:     #a8ff3e;
    --phosphor-dim: #2e4a10;
    --seal:         #4a7a1a;
    --amber:        #ffb830;
    --red:          #ff3a3a;
    --red-dim:      #7a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: var(--phosphor);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: crosshair;
  }

  /* CRT scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.20) 0px, rgba(0,0,0,0.20) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none; z-index: 1000;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 75%, rgba(0,0,0,0.5) 100%);
    pointer-events: none; z-index: 999;
  }

  @keyframes flicker {
    0%, 94%, 100% { opacity: 1; }
    95%  { opacity: 0.88; }
    97%  { opacity: 0.95; }
  }

  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes powerOn {
    0%   { transform: scaleY(0.01); filter: brightness(6) saturate(0); opacity: 0.5; }
    15%  { transform: scaleY(0.01); filter: brightness(10) saturate(0); opacity: 1; }
    30%  { transform: scaleY(1); filter: brightness(1.8); }
    55%  { transform: scaleY(1); filter: brightness(0.8); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }

  @keyframes crtOff {
    0%   { transform: scaleY(1); filter: brightness(1); opacity: 1; }
    10%  { transform: scaleY(1); filter: brightness(3) saturate(0); }
    25%  { transform: scaleY(0.04); filter: brightness(8); }
    60%  { transform: scaleY(0.02); filter: brightness(3); }
    100% { transform: scaleY(0.01); filter: brightness(0); opacity: 0; }
  }

  .screen {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: powerOn 1.1s cubic-bezier(0, 0, 0.4, 1) forwards,
               flicker 11s 1.1s infinite;
    transform-origin: center center;
  }

  /* ── TEXT STAGE ── */
  .stage {
    width: 100%;
    max-width: 540px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
  }

  .type-line {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.2px;
    line-height: 1;
    margin-bottom: 7px;
    min-height: 11px;
  }

  .type-line.spacer    { margin-bottom: 20px; }
  .type-line.spacer-sm { margin-bottom: 11px; }

  .type-line.line-header {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--phosphor-dim);
  }

  .type-line.line-status {
    font-family: 'VT323', monospace;
    font-size: 38px;
    letter-spacing: 4px;
    color: var(--red);
    text-shadow: 0 0 18px rgba(255, 58, 58, 0.5);
    line-height: 1;
    margin-bottom: 0;
  }

  .type-line.line-death {
    font-size: 12px;
    letter-spacing: 1px;
    color: #cc3030;
    line-height: 1.6;
    margin-bottom: 4px;
  }

  .type-line.line-record {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--phosphor-dim);
    opacity: 0.8;
  }

  .type-line.line-seal {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--seal);
  }

  /* blinking block cursor */
  .cursor {
    display: inline-block;
    width: 7px;
    background: currentColor;
    animation: cursorBlink 0.65s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 1px;
  }
  .line-status .cursor    { height: 28px; }
  .line-death  .cursor    { height: 11px; }
  .type-line   .cursor    { height: 9px; }

  /* ── RETURN BUTTON ── */
  .btn-return {
    margin-top: 36px;
    align-self: flex-start;
    background: none;
    border: 1px solid var(--red-dim);
    color: #7a2a2a;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 10px 24px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    animation: none;
  }

  .btn-return.visible {
    opacity: 1;
    pointer-events: auto;
    animation: fadeIn 1.4s ease forwards;
  }

  .btn-return.visible:hover {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 12px rgba(255, 58, 58, 0.2);
  }

  /* horizontal rule between death text and record section */
  .stage-rule {
    border: none;
    border-top: 1px solid #1a0a0a;
    margin: 16px 0 14px 0;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .stage-rule.visible { opacity: 1; }
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="stage" id="stage">
    <!-- typewriter injects here -->
  </div>
</div>

<script>
;(function() {
  'use strict'

  /* ── Read report ───────────────────────────────────────────────── */
  var report = null
  try {
    var raw = localStorage.getItem('thermalShiftReport')
    if (raw) report = JSON.parse(raw)
  } catch(e) {}

  if (!report) {
    window.location.href = 'menu.html'
    return
  }

  var isMeltdown = !!report.meltdownOccurred
  var isStreet   = !!report.streetDeath

  if (!isMeltdown && !isStreet) {
    window.location.href = 'menu.html'
    return
  }

  var shiftNum = report.shiftNumber || 1

  /* ── Build sequence ────────────────────────────────────────────── */
  var SEQ = []

  function s(text, cls, charMs, preMs) {
    SEQ.push({ text: text, cls: cls, charMs: charMs, preMs: preMs })
  }

  if (isMeltdown) {

    s('// SHIFT ' + shiftNum + '  —  EMPLOYMENT TERMINAL', 'line-header', 22, 900)
    s('', 'spacer-sm', 0, 100)
    s('STATUS:  TERMINATED', 'line-status', 70, 500)
    s('', 'spacer', 0, 200)

    s('Containment event logged. Unit 4 shutdown initiated.',       'line-death', 38, 0  )
    s('Incident attributed to operator failure. File referred.',    'line-death', 38, 140)
    s('Employment contract cancelled with immediate effect.',       'line-death', 38, 140)
    s('',                                                           'spacer-sm',   0, 240)
    s('Treatment fund frozen pending administrative review.',       'line-death', 38, 0  )
    s('Mira\'s next appointment has been cancelled.',              'line-death', 38, 140)
    s('No further contact expected from the facility.',            'line-death', 38, 140)

    /* rule separator injected after desc — ruleInjectedAfter computed below */

    s('', 'spacer-sm', 0, 700)
    s('OUTSTANDING WAGES        0 UNITS',         'line-record', 16, 0  )
    s('TREATMENT FUND           FROZEN',          'line-record', 16, 55 )
    s('REASON CODE              OPERATIONAL FAILURE', 'line-record', 16, 55)
    s('', 'spacer', 0, 600)
    s('// OPERATOR FILE OP.18 — RECORD CLOSED',  'line-seal',   22, 0  )
    s('// THIS POSITION WILL BE FILLED.',        'line-seal',   22, 180)

  } else {

    /* Street death ─────────────────────────────────────────────── */
    var descRaw   = report.streetDeathDesc || 'NO RECORD ON FILE.'
    var descLines = descRaw.split('\n').filter(function(l) { return l.trim() !== '' })

    s('// SHIFT ' + shiftNum + '  —  EMPLOYMENT TERMINAL', 'line-header', 22, 900)
    s('', 'spacer-sm', 0, 100)
    s('STATUS:  NON-RETURN', 'line-status', 70, 500)
    s('', 'spacer', 0, 200)

    descLines.forEach(function(line, i) {
      s(line, 'line-death', 42, i === 0 ? 0 : 120)
    })

    s('', 'spacer-sm', 0, 800)
    s('OUTSTANDING WAGES        0 UNITS',          'line-record', 16, 0  )
    s('DEPENDENTS ON FILE       NO CONTACT MADE',  'line-record', 16, 55 )
    s('REASON CODE              UNHOUSED',         'line-record', 16, 55 )
    s('', 'spacer', 0, 600)
    s('// OPERATOR FILE 7B — RECORD CLOSED',      'line-seal',   22, 0  )
    s('// THIS POSITION WILL BE FILLED.',          'line-seal',   22, 180)

  }

  /* ── Typewriter engine ─────────────────────────────────────────── */
  var stage     = document.getElementById('stage')
  var cursorEl  = null
  var ruleEl    = null
  var idx       = 0
  /* Rule appears just before the first record line — computed from SEQ */
  var ruleInjectedAfter = SEQ.findIndex(function(item) { return item.cls === 'line-record' }) - 1

  function removeCursor() {
    if (cursorEl && cursorEl.parentNode) {
      cursorEl.parentNode.removeChild(cursorEl)
      cursorEl = null
    }
  }

  function showRule() {
    if (ruleEl) return
    ruleEl = document.createElement('hr')
    ruleEl.className = 'stage-rule'
    stage.appendChild(ruleEl)
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { ruleEl.classList.add('visible') })
    })
  }

  function showButton() {
    var btn = document.createElement('button')
    btn.className   = 'btn-return'
    btn.textContent = '[ RETURN TO MENU ]'
    stage.appendChild(btn)
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { btn.classList.add('visible') })
    })
    btn.addEventListener('click', function() {
      var scr = document.getElementById('screen')
      scr.style.animation = 'crtOff 0.7s cubic-bezier(0.4, 0, 1, 1) forwards'
      setTimeout(function() { window.location.href = 'menu.html' }, 660)
    })
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
        document.removeEventListener('keydown', handler)
        btn.click()
      }
    })
  }

  function nextItem() {
    if (idx >= SEQ.length) {
      removeCursor()
      setTimeout(showButton, 2200)
      return
    }

    /* Inject the rule separator after desc block */
    if (idx === ruleInjectedAfter) showRule()

    var item = SEQ[idx++]

    setTimeout(function() {
      var lineEl = document.createElement('div')
      lineEl.className = 'type-line ' + (item.cls || '')
      stage.appendChild(lineEl)

      /* Scroll into view smoothly */
      lineEl.scrollIntoView && lineEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' })

      if (item.charMs === 0 || item.text === '') {
        nextItem()
        return
      }

      removeCursor()
      cursorEl = document.createElement('span')
      cursorEl.className = 'cursor'
      lineEl.appendChild(cursorEl)

      var chars   = item.text.split('')
      var charIdx = 0

      function nextChar() {
        if (charIdx >= chars.length) {
          removeCursor()
          nextItem()
          return
        }
        var ch = chars[charIdx++]
        lineEl.insertBefore(document.createTextNode(ch), cursorEl)

        var delay = item.charMs
        if (ch === '.' || ch === ':') delay += 90
        else if (ch === ',')          delay += 50
        else if (ch === '—')          delay += 70
        setTimeout(nextChar, delay)
      }

      nextChar()
    }, item.preMs)
  }

  /* ── Start after power-on animation settles ───────────────────── */
  setTimeout(nextItem, 1100)

})()
</script>

</body>
</html>
