<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERMAL — Home Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --phosphor:      #a8ff3e;
    --phosphor-dim:  #4a7a1a;
    --phosphor-glow: rgba(168, 255, 62, 0.15);
    --amber:         #ffb830;
    --red-alert:     #ff3a3a;
    --bg:            #080a04;
    --panel-bg:      #0b0f05;
    --border:        #1e2e0c;
    --scanline:      rgba(0,0,0,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: var(--phosphor);
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  /* ── CRT EFFECTS ──────────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scanline) 0px,
      var(--scanline) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 1000;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.88) 100%);
    pointer-events: none;
    z-index: 999;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97%           { opacity: 0.90; }
    98.5%         { opacity: 0.96; }
  }

  @keyframes powerOn {
    0%   { transform: scaleY(0.01); filter: brightness(8) saturate(0); opacity: 0.6; }
    12%  { transform: scaleY(0.01); filter: brightness(12) saturate(0); opacity: 1; }
    24%  { transform: scaleY(1);    filter: brightness(2); opacity: 1; }
    36%  { transform: scaleY(1);    filter: brightness(0.75); opacity: 1; }
    50%  { transform: scaleY(1);    filter: brightness(1.3); opacity: 1; }
    70%  { transform: scaleY(1);    filter: brightness(1); opacity: 1; }
    100% { transform: scaleY(1);    filter: brightness(1); opacity: 1; }
  }

  @keyframes crtOff {
    0%   { transform: scaleY(1);    filter: brightness(1); opacity: 1; }
    8%   { transform: scaleY(1);    filter: brightness(3) saturate(0); opacity: 1; }
    22%  { transform: scaleY(0.04); filter: brightness(8); opacity: 1; }
    55%  { transform: scaleY(0.02); filter: brightness(3); opacity: 1; }
    100% { transform: scaleY(0.01); filter: brightness(0); opacity: 0; }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes ambientFade {
    0%   { opacity: 0; }
    15%  { opacity: 0.55; }
    85%  { opacity: 0.55; }
    100% { opacity: 0; }
  }

  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  /* ── TERMINAL GRID ────────────────────────────────────────────── */
  .terminal {
    display: grid;
    grid-template-rows: 54px 40px 1fr 52px;
    grid-template-columns: 1fr;
    height: 100vh;
    padding: 10px;
    gap: 6px;
    animation: powerOn 0.8s cubic-bezier(0, 0, 0.4, 1) forwards, flicker 9s 0.8s infinite;
    transform-origin: center center;
  }

  /* ── HEADER ───────────────────────────────────────────────────── */
  .header {
    border: 1px solid var(--border);
    background: var(--panel-bg);
    padding: 6px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .header-left-stack {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .header-title {
    font-family: 'VT323', monospace;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--phosphor);
    text-shadow: 0 0 6px var(--phosphor);
  }

  .header-sub {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--phosphor-dim);
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .header-clock {
    font-family: 'VT323', monospace;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--phosphor);
    text-shadow: 0 0 4px var(--phosphor);
  }

  .header-host {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--phosphor-dim);
  }

  /* ── TABS ─────────────────────────────────────────────────────── */
  .tab-row {
    display: flex;
    align-items: stretch;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding: 0 2px;
  }

  .tab {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--border);
    border-bottom: none;
    color: var(--phosphor-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 8px 22px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, text-shadow 0.15s;
    position: relative;
    top: 1px;
  }

  .tab:hover {
    color: var(--phosphor);
    background: rgba(168, 255, 62, 0.04);
  }

  .tab.active {
    color: var(--phosphor);
    text-shadow: 0 0 6px var(--phosphor);
    background: var(--panel-bg);
    border-color: var(--phosphor-dim);
  }

  .tab.active::after {
    content: '';
    position: absolute;
    left: -1px;
    right: -1px;
    bottom: -1px;
    height: 1px;
    background: var(--panel-bg);
  }

  .tab.visited:not(.active)::before {
    content: '•';
    color: var(--phosphor-dim);
    margin-right: 6px;
    opacity: 0.7;
  }

  .tab-key {
    font-size: 9px;
    color: var(--phosphor-dim);
    margin-right: 8px;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  .tab-spacer { flex: 1; }

  /* ── CONTENT AREA ─────────────────────────────────────────────── */
  .content {
    border: 1px solid var(--border);
    border-top: none;
    background: var(--panel-bg);
    padding: 18px;
    overflow: hidden;
    position: relative;
    animation: fadeSlideIn 0.5s 0.45s both;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .tab-panel {
    display: none;
    flex: 1;
    min-height: 0;
    overflow: auto;
    animation: fadeSlideIn 0.25s both;
  }
  .tab-panel.active { display: flex; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--phosphor-dim);
    font-size: 14px;
    letter-spacing: 3px;
    text-align: center;
  }

  .empty-state::after {
    content: '_';
    color: var(--phosphor);
    font-size: 16px;
    animation: cursorBlink 1s step-end infinite;
  }

  /* ── AMBIENT LOG TICKER (bottom of content area) ──────────────── */
  .ambient-log {
    position: absolute;
    left: 16px;
    bottom: 8px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--phosphor-dim);
    opacity: 0;
    pointer-events: none;
    font-family: 'Share Tech Mono', monospace;
  }
  .ambient-log.show {
    animation: ambientFade 6s ease-in-out forwards;
  }

  /* ── BOTTOM BAR ───────────────────────────────────────────────── */
  .action-bar {
    border: 1px solid var(--border);
    background: var(--panel-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
  }

  .action-hint {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--phosphor-dim);
  }

  .action-btn {
    background: none;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 8px 24px;
    cursor: not-allowed;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .action-btn.ready {
    border-color: var(--phosphor);
    color: var(--phosphor);
    text-shadow: 0 0 4px var(--phosphor);
    cursor: pointer;
  }
  .action-btn.ready:hover {
    background: rgba(168, 255, 62, 0.12);
    box-shadow: 0 0 14px rgba(168, 255, 62, 0.3);
  }
</style>
</head>
<body>

<div class="terminal">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left-stack">
      <div class="header-title">// HOME TERMINAL — UNIT 7B</div>
      <div class="header-sub">PERSONAL COMPUTER  |  SHIFT <span id="hdr-shift">—</span> COMPLETE</div>
    </div>
    <div class="header-right">
      <div class="header-clock" id="hdr-clock">--:-- --</div>
      <div class="header-host">LOCALHOST / PRIV</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tab-row" role="tablist">
    <button class="tab active" data-tab="messages" id="tab-messages" role="tab">
      <span class="tab-key">[1]</span>MESSAGES
    </button>
    <button class="tab" data-tab="news" id="tab-news" role="tab">
      <span class="tab-key">[2]</span>NEWS
    </button>
    <button class="tab" data-tab="bank" id="tab-bank" role="tab">
      <span class="tab-key">[3]</span>BANK
    </button>
    <div class="tab-spacer"></div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="tab-panel active" id="panel-messages" role="tabpanel">
      <div class="msg-wrap">
        <div class="msg-header">
          <span class="msg-contact">ELENA</span>
          <span class="msg-sep">—</span>
          <span class="msg-status" id="msg-status">ONLINE</span>
        </div>
        <div class="msg-log" id="msg-log"><!-- messages injected here --></div>
        <div class="msg-decision" id="msg-decision" style="display:none;">
          <div class="msg-decision-label">// DECISION REQUIRED</div>
          <div class="msg-decision-row" id="msg-decision-row"><!-- buttons injected --></div>
        </div>
        <div class="msg-ended" id="msg-ended" style="display:none;">// CONVERSATION ENDED</div>
      </div>
    </div>

    <div class="tab-panel" id="panel-news" role="tabpanel">
      <div class="empty-state">// LOADING FEED...</div>
    </div>

    <div class="tab-panel" id="panel-bank" role="tabpanel">
      <div class="empty-state">// CONNECTING...</div>
    </div>

    <div class="ambient-log" id="ambient-log"></div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <div class="action-hint" id="action-hint">// REVIEW ALL TABS</div>
    <button class="action-btn" id="btn-sleep" disabled>[ SLEEP — NEXT SHIFT ]</button>
  </div>

</div>

<script src="../js/saveSystem.js"></script>
<script>
/* ═════════════════════════════════════════════════════════════════
   THERMAL — Home Terminal (skeleton)
   Tab-based post-shift hub. Player reviews MESSAGES / NEWS / BANK
   before sleeping into the next shift. Tab content is filled in
   later passes; this file wires only navigation, the sleep gate,
   the real-time clock, and the ambient log ticker.
   ═════════════════════════════════════════════════════════════════ */
(function() {
  'use strict'

  /* ── Save integration ─────────────────────────────────────────── */
  var _save = (window.saveSystem && window.saveSystem.loadGame)
    ? window.saveSystem.loadGame()
    : null

  var _shiftNum = _save ? (_save.shiftNumber || 1) : 1
  document.getElementById('hdr-shift').textContent = _shiftNum

  /* ── Tab navigation ──────────────────────────────────────────── */
  var TAB_IDS = ['messages', 'news', 'bank']
  var _visited = { messages: true, news: false, bank: false }  // default tab counts as visited
  var _activeTab = 'messages'

  function setTab(id) {
    if (TAB_IDS.indexOf(id) === -1) return
    _activeTab = id
    _visited[id] = true

    TAB_IDS.forEach(function(t) {
      var btn   = document.getElementById('tab-' + t)
      var panel = document.getElementById('panel-' + t)
      var isActive = (t === id)
      btn.classList.toggle('active',  isActive)
      btn.classList.toggle('visited', _visited[t] && !isActive)
      panel.classList.toggle('active', isActive)
    })

    _refreshSleepGate()
  }

  TAB_IDS.forEach(function(t) {
    document.getElementById('tab-' + t).addEventListener('click', function() {
      setTab(t)
    })
  })

  document.addEventListener('keydown', function(e) {
    if (e.key === '1')      setTab('messages')
    else if (e.key === '2') setTab('news')
    else if (e.key === '3') setTab('bank')
  })

  /* ── Sleep button gating ─────────────────────────────────────── */
  var btnSleep = document.getElementById('btn-sleep')
  var hint     = document.getElementById('action-hint')

  function _allVisited() {
    return _visited.messages && _visited.news && _visited.bank
  }

  function _refreshSleepGate() {
    var ready = _allVisited()
    btnSleep.classList.toggle('ready', ready)
    btnSleep.disabled = !ready
    hint.textContent = ready
      ? '// READY — SLEEP TO BEGIN NEXT SHIFT'
      : '// REVIEW ALL TABS'
  }
  _refreshSleepGate()

  /* ── Sleep → transition ──────────────────────────────────────── */
  function crtOffAndNavigate(url) {
    var t = document.querySelector('.terminal')
    t.style.animation = 'crtOff 0.65s cubic-bezier(0.4, 0, 1, 1) forwards'
    setTimeout(function() { window.location.href = url }, 620)
  }

  btnSleep.addEventListener('click', function() {
    if (btnSleep.disabled) return

    /* Re-read the save at the moment of transition in case any tab
       (bank rent payment, etc.) mutated it while the player was here. */
    var s = (window.saveSystem ? window.saveSystem.loadGame() : _save) || _save

    /* Dead-end states → back to menu, menu.html handles UI. */
    if (s && (s.gameOver || s.evicted)) {
      crtOffAndNavigate('menu.html')
      return
    }

    /* Legacy key kept in sync for any code still reading it. */
    try { localStorage.setItem('thermalShiftNumber', String(s ? s.shiftNumber : _shiftNum)) } catch (e) {}

    crtOffAndNavigate('game.html')
  })

  /* ── Real-world clock in header ──────────────────────────────── */
  function _fmtClock() {
    var d  = new Date()
    var h  = d.getHours()
    var m  = d.getMinutes()
    var ap = h >= 12 ? 'PM' : 'AM'
    var h12 = h % 12; if (h12 === 0) h12 = 12
    return (h12 < 10 ? '0' + h12 : h12) + ':' +
           (m  < 10 ? '0' + m  : m)  + ' ' + ap
  }
  var clockEl = document.getElementById('hdr-clock')
  function _tickClock() { clockEl.textContent = _fmtClock() }
  _tickClock()
  setInterval(_tickClock, 1000)

  /* ── Ambient log ticker ──────────────────────────────────────── */
  var AMBIENT_LINES = [
    '// system idle — thermal check nominal',
    '// network: local only',
    '// disk usage: 12%',
    '// background svc: mailwatch [ok]',
    '// cache swept — 0 errors',
    '// clock drift: +0.002s',
    '// uptime: 14h 22m',
    '// last backup: 3d ago',
    '// power draw: 41W nominal',
    '// kernel: unit7b-build.04',
  ]
  var ambEl = document.getElementById('ambient-log')
  function _ambientLoop() {
    var line = AMBIENT_LINES[Math.floor(Math.random() * AMBIENT_LINES.length)]
    ambEl.textContent = line
    ambEl.classList.remove('show')
    /* force reflow so the animation restarts cleanly */
    void ambEl.offsetWidth
    ambEl.classList.add('show')
    var next = 30000 + Math.floor(Math.random() * 30000) // 30–60 s
    setTimeout(_ambientLoop, next)
  }
  setTimeout(_ambientLoop, 4000 + Math.floor(Math.random() * 4000))

})()
</script>

</body>
</html>
